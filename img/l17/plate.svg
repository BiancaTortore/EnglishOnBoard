<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Our ship from above with the bow and quarter sectors, a crossing ship on the starboard bow, an overtaking ship on the port quarter and a head-on ship ahead">
