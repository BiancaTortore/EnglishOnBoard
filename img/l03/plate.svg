<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 400 236" role="img" aria-label="Cutaway of the accommodation, deck by deck">
  <!-- Lesson 3 plate: cutaway of the accommodation (stern on the left). Colours come from app.css (.p-*) -->
  <rect class="p-soft" x="0" y="10" width="400" height="236"/>
  <!-- part of a cargo tank dome forward -->
  <circle class="p-dome" cx="372" cy="170" r="38" stroke-width="1.5"/>
  <!-- hull with the engine room inside -->
  <path class="p-hull" d="M58 178 L400 178 L400 242 L92 242 Q60 238 58 212 Z"/>
  <path class="p-red" d="M62 228 L400 228 L400 242 L92 242 Q70 240 62 228 Z"/>
  <rect class="p-deck" x="70" y="182" width="222" height="42"/>
  <g class="p-ink" opacity=".55"><rect x="104" y="192" width="96" height="26" rx="3"/></g>
  <g class="p-soft"><circle cx="122" cy="200" r="5"/><circle cx="140" cy="200" r="5"/><circle cx="158" cy="200" r="5"/><circle cx="176" cy="200" r="5"/></g>
  <!-- accommodation block -->
  <rect class="p-super" x="70" y="48" width="222" height="130"/>
  <rect class="p-super" x="62" y="22" width="238" height="26"/>
  <rect class="p-hull" x="68" y="28" width="226" height="7" opacity=".7"/>
  <g style="stroke:var(--hull);fill:none" stroke-width="1" opacity=".55">
    <line x1="62" y1="48" x2="300" y2="48"/><line x1="70" y1="74" x2="292" y2="74"/><line x1="70" y1="100" x2="292" y2="100"/>
    <line x1="70" y1="126" x2="292" y2="126"/><line x1="70" y1="152" x2="292" y2="152"/>
    <line x1="145" y1="48" x2="145" y2="126"/><line x1="150" y1="152" x2="150" y2="178"/>
    <rect x="62" y="22" width="238" height="156" fill="none"/>
  </g>
  <!-- cabins (D and C deck): bunk with pillow, and a porthole -->
  <g class="p-soft"><rect x="78" y="62" width="34" height="8" rx="2"/><rect x="78" y="88" width="34" height="8" rx="2"/>
    <rect x="156" y="62" width="34" height="8" rx="2"/><rect x="156" y="88" width="34" height="8" rx="2"/></g>
  <g class="p-hull" opacity=".45"><rect x="79" y="59" width="9" height="4" rx="2"/><rect x="79" y="85" width="9" height="4" rx="2"/>
    <rect x="157" y="59" width="9" height="4" rx="2"/><rect x="157" y="85" width="9" height="4" rx="2"/></g>
  <g stroke-width="1.2"><circle style="stroke:var(--hull);fill:none" cx="100" cy="54" r="4"/><circle style="stroke:var(--hull);fill:none" cx="100" cy="80" r="4"/>
    <circle style="stroke:var(--hull);fill:none" cx="178" cy="54" r="4"/><circle style="stroke:var(--hull);fill:none" cx="178" cy="80" r="4"/></g>
  <!-- smoking room (B-deck, left): armchair and a big lit cigarette with smoke -->
  <g class="p-hull" opacity=".5"><rect x="76" y="114" width="16" height="6" rx="1"/><rect x="76" y="106" width="4" height="14" rx="1"/><rect x="77" y="120" width="2" height="6"/><rect x="89" y="120" width="2" height="6"/></g>
  <rect style="fill:#FFFFFF;stroke:var(--hull);stroke-width:.8" x="98" y="113" width="30" height="5" rx="1"/>
  <rect class="p-gold" x="98" y="113" width="8" height="5"/>
  <rect class="p-orange" x="127" y="113" width="4" height="5" rx="1"/>
  <g style="stroke:var(--hull);fill:none" stroke-width="1.3" opacity=".6" stroke-linecap="round"><path d="M133 112 q3 -3 0 -5 q-3 -2 0 -5"/><path d="M138 112 q3 -3 0 -5 q-3 -2 0 -5"/></g>
  <!-- recreation room (B-deck, right): TV with sofa, and a table-tennis table -->
  <rect class="p-hull" x="150" y="103" width="22" height="13" rx="1" opacity=".7"/>
  <rect class="p-blue" x="152" y="105" width="18" height="9"/>
  <g class="p-hull" opacity=".45"><rect x="152" y="120" width="18" height="6" rx="2"/></g>
  <rect class="p-deck" x="178" y="114" width="34" height="4" rx="1"/>
  <g class="p-hull" opacity=".6"><rect x="181" y="118" width="2" height="8"/><rect x="207" y="118" width="2" height="8"/><rect x="194.5" y="109" width="1.5" height="5"/></g>
  <circle class="p-orange" cx="184" cy="108" r="2"/>
  <!-- mess room: tables and chairs -->
  <g class="p-hull" opacity=".5"><rect x="88" y="140" width="40" height="5" rx="1"/><rect x="150" y="140" width="40" height="5" rx="1"/>
    <rect x="90" y="146" width="4" height="6"/><rect x="122" y="146" width="4" height="6"/><rect x="152" y="146" width="4" height="6"/><rect x="184" y="146" width="4" height="6"/></g>
  <!-- galley: cooker with an oven door, a pot on the fire with steam, and a frying pan -->
  <rect class="p-hull" x="78" y="166" width="46" height="12" rx="1" opacity=".55"/>
  <rect class="p-super" x="84" y="169" width="34" height="6" rx="1"/>
  <g class="p-orange"><path d="M85 166 l2 -3 l2 3 z"/><path d="M91 166 l2 -3 l2 3 z"/><path d="M97 166 l2 -3 l2 3 z"/></g>
  <rect class="p-hull" x="83" y="155" width="18" height="8" rx="1" opacity=".75"/>
  <g class="p-hull" opacity=".75"><rect x="80" y="157" width="3" height="2"/><rect x="101" y="157" width="3" height="2"/><rect x="106" y="160" width="12" height="3" rx="1"/><rect x="118" y="161" width="7" height="1.5"/></g>
  <g style="stroke:var(--hull);fill:none" stroke-width="1.2" opacity=".5" stroke-linecap="round"><path d="M88 153 q2 -2 0 -4"/><path d="M95 153 q2 -2 0 -4"/></g>
  <!-- laundry: two washing machines and clothes on a line -->
  <g class="p-hull" opacity=".55"><rect x="154" y="162" width="16" height="16" rx="2"/><rect x="172" y="162" width="16" height="16" rx="2"/></g>
  <g class="p-super"><circle cx="162" cy="171" r="5"/><circle cx="180" cy="171" r="5"/></g>
  <g class="p-blue"><circle cx="162" cy="171" r="3"/><circle cx="180" cy="171" r="3"/></g>
  <line style="stroke:var(--hull);fill:none" x1="152" y1="156" x2="220" y2="156" stroke-width=".8" opacity=".6"/>
  <path class="p-orange" d="M190 156 h12 l4 3 l-3 2 l-1 -1 v8 h-12 v-8 l-1 1 l-3 -2 z"/>
  <path class="p-blue" d="M209 156 h4 v8 l3 2 v2 h-5 l-2 -2 z"/>
  <!-- lift shaft with the car -->
  <rect class="p-soft" x="222" y="48" width="18" height="130"/>
  <rect class="p-hull" x="224" y="78" width="14" height="18" rx="1" opacity=".6"/>
  <line style="stroke:var(--hull);fill:none" x1="231" y1="48" x2="231" y2="78" stroke-width="1"/>
  <!-- stairs, every deck down to the engine room -->
  <g style="stroke:var(--hull);fill:none" stroke-width="1.6">
    <path d="M248 74 L268 48"/><path d="M248 100 L268 74"/><path d="M248 126 L268 100"/><path d="M248 152 L268 126"/><path d="M248 178 L268 152"/>
  </g>
  <path class="p-stroke" stroke-width="1.6" d="M248 222 L268 182"/>
  <!-- deck names -->
  <g class="p-label" text-anchor="end">
    <text x="56" y="38">BRIDGE</text><text x="64" y="64">D-DECK</text><text x="64" y="90">C-DECK</text>
    <text x="64" y="116">B-DECK</text><text x="64" y="142">A-DECK</text><text x="56" y="168">MAIN</text>
  </g>
</svg>
