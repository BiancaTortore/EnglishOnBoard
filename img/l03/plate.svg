<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 400 236" role="img" aria-label="Cutaway of the accommodation, deck by deck">
  <!-- Lesson 3 plate: cutaway of the accommodation (stern on the left). Colours come from app.css (.p-*) -->
  <rect class="p-soft" x="0" y="10" width="400" height="236"/>
  <!-- part of a cargo tank dome forward -->
  <circle class="p-dome" cx="372" cy="170" r="38" stroke-width="1.5"/>
  <!-- hull with the engine room inside -->
  <path class="p-hull" d="M58 178 L400 178 L400 242 L92 242 Q60 238 58 212 Z"/>
  <path class="p-red" d="M62 228 L400 228 L400 242 L92 242 Q70 240 62 228 Z"/>
  <rect class="p-deck" x="70" y="182" width="222" height="42"/>
  <g class="p-ink" opacity=".55"><rect x="104" y="192" width="96" height="26" rx="3"/></g>
  <g class="p-soft"><circle cx="122" cy="200" r="5"/><circle cx="140" cy="200" r="5"/><circle cx="158" cy="200" r="5"/><circle cx="176" cy="200" r="5"/></g>
  <!-- accommodation block -->
  <rect class="p-super" x="70" y="48" width="222" height="130"/>
  <rect class="p-super" x="62" y="22" width="238" height="26"/>
  <rect class="p-ink" x="68" y="28" width="226" height="7" opacity=".7"/>
  <g class="p-stroke" stroke-width="1" opacity=".55">
    <line x1="62" y1="48" x2="300" y2="48"/><line x1="70" y1="74" x2="292" y2="74"/><line x1="70" y1="100" x2="292" y2="100"/>
    <line x1="70" y1="126" x2="292" y2="126"/><line x1="70" y1="152" x2="292" y2="152"/>
    <line x1="145" y1="48" x2="145" y2="126"/><line x1="150" y1="152" x2="150" y2="178"/>
    <rect x="62" y="22" width="238" height="156" fill="none"/>
  </g>
  <!-- cabins: bunk and window -->
  <g class="p-soft"><rect x="78" y="62" width="34" height="8" rx="2"/><rect x="78" y="88" width="34" height="8" rx="2"/><rect x="78" y="114" width="34" height="8" rx="2"/>
    <rect x="156" y="62" width="34" height="8" rx="2"/><rect x="156" y="88" width="34" height="8" rx="2"/><rect x="156" y="114" width="34" height="8" rx="2"/></g>
  <!-- mess room: tables and chairs -->
  <g class="p-ink" opacity=".5"><rect x="88" y="140" width="40" height="5" rx="1"/><rect x="150" y="140" width="40" height="5" rx="1"/>
    <rect x="90" y="146" width="4" height="6"/><rect x="122" y="146" width="4" height="6"/><rect x="152" y="146" width="4" height="6"/><rect x="184" y="146" width="4" height="6"/></g>
  <!-- galley: cooker with rings -->
  <rect class="p-ink" x="84" y="160" width="44" height="18" rx="2" opacity=".55"/>
  <g class="p-soft"><circle cx="96" cy="166" r="3.5"/><circle cx="116" cy="166" r="3.5"/></g>
  <!-- laundry: two washing machines -->
  <g class="p-ink" opacity=".55"><rect x="160" y="158" width="20" height="20" rx="2"/><rect x="186" y="158" width="20" height="20" rx="2"/></g>
  <g class="p-soft"><circle cx="170" cy="168" r="6"/><circle cx="196" cy="168" r="6"/></g>
  <!-- lift shaft with the car -->
  <rect class="p-soft" x="222" y="48" width="18" height="130"/>
  <rect class="p-ink" x="224" y="78" width="14" height="18" rx="1" opacity=".6"/>
  <line class="p-stroke" x1="231" y1="48" x2="231" y2="78" stroke-width="1"/>
  <!-- stairs, every deck down to the engine room -->
  <g class="p-stroke" stroke-width="1.6">
    <path d="M248 74 L268 48"/><path d="M248 100 L268 74"/><path d="M248 126 L268 100"/><path d="M248 152 L268 126"/><path d="M248 178 L268 152"/><path d="M248 222 L268 182"/>
  </g>
  <!-- deck names -->
  <g class="p-label" text-anchor="end">
    <text x="56" y="38">BRIDGE</text><text x="64" y="64">D-DECK</text><text x="64" y="90">C-DECK</text>
    <text x="64" y="116">B-DECK</text><text x="64" y="142">A-DECK</text><text x="56" y="168">MAIN</text>
  </g>
</svg>
