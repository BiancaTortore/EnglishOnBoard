<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Bunkering at anchor seen from above: the barge alongside with the oil boom around it, the hose to the bunker station, plugged scuppers, the SOPEP locker and a small spill in the drip tray">
  <!-- Lesson 20 plate: seen from above. The ship's port side is at the top, the bunker barge alongside below it,
       the yellow oil boom floats around the barge. The hose runs from the barge to the bunker station (drip tray);
       the arrow shows the bunkers going in. Scuppers along the deck edge are plugged (red plugs). The SOPEP locker
       is next to the bunker station; a small spill sits in the drip tray. Colours come from app.css (.p-*). -->
  <rect class="p-water" x="0" y="0" width="400" height="240"/>
  <!-- ship (port side towards the barge) -->
  <rect x="0" y="0" width="400" height="92" class="p-hull"/>
  <rect x="0" y="0" width="400" height="84" class="p-deck"/>
  <!-- scuppers along the deck edge, plugged -->
  <g><circle cx="40" cy="78" r="5" class="p-hull"/><circle cx="40" cy="78" r="3" style="fill:#E23D2D"/>
     <circle cx="120" cy="78" r="5" class="p-hull"/><circle cx="120" cy="78" r="3" style="fill:#E23D2D"/>
     <circle cx="300" cy="78" r="5" class="p-hull"/><circle cx="300" cy="78" r="3" style="fill:#E23D2D"/>
     <circle cx="370" cy="78" r="5" class="p-hull"/><circle cx="370" cy="78" r="3" style="fill:#E23D2D"/></g>
  <!-- bunker station with drip tray -->
  <rect x="176" y="40" width="56" height="34" rx="3" style="fill:#5E6B78"/>
  <rect x="182" y="46" width="44" height="22" rx="2" class="p-hull" opacity=".7"/>
  <circle cx="204" cy="57" r="5" class="p-white"/>
  <!-- small spill in the drip tray -->
  <path d="M184 62 q6 -6 12 -2 q6 3 10 -1 q4 4 -2 7 q-8 3 -20 -4 z" style="fill:#1B1B1B" opacity=".75"/>
  <!-- SOPEP locker -->
  <rect x="246" y="30" width="36" height="40" rx="3" style="fill:#F2C230;stroke:var(--hull)" stroke-width="1.5"/>
  <rect x="252" y="36" width="24" height="10" rx="1" class="p-white"/>
  <circle cx="276" cy="56" r="2" class="p-hull"/>
  <!-- barge -->
  <path d="M60 118 H330 Q350 118 350 140 V176 Q350 198 330 198 H60 Q40 198 40 176 V140 Q40 118 60 118 Z" class="p-red"/>
  <rect x="80" y="130" width="70" height="56" rx="4" style="fill:#7A3226"/><rect x="170" y="130" width="70" height="56" rx="4" style="fill:#7A3226"/>
  <rect x="270" y="132" width="50" height="40" rx="3" class="p-super"/>
  <!-- hose from barge manifold to the bunker station, with flow arrow -->
  <path d="M210 128 C210 108 204 100 204 74" fill="none" style="stroke:#1B1B1B" stroke-width="6" stroke-linecap="round"/>
  <path d="M222 112 V92 M216 98 L222 90 L228 98" fill="none" style="stroke:#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- oil boom around the barge -->
  <path d="M28 104 H362 Q382 104 382 126 V196 Q382 222 360 222 H30 Q10 222 10 196 V126 Q10 104 28 104 Z" fill="none" style="stroke:#F2C230" stroke-width="4" stroke-dasharray="10 4"/>
</svg>
