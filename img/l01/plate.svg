<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-label="The ship seen from above, port side alongside the quay">
  <!-- Lesson 1 plate: ship from above, bow to the right, port side against the quay (top). Colours come from app.css (.p-*) -->
  <rect class="p-water" x="0" y="0" width="400" height="250"/>
  <rect class="p-quay" x="0" y="0" width="400" height="52"/>
  <line class="p-line" x1="0" y1="52" x2="400" y2="52" stroke-width="1.5"/>
  <text class="p-label" x="10" y="20">QUAY · BERTH 7</text>
  <!-- bollards -->
  <g class="p-ink"><circle cx="30" cy="42" r="4"/><circle cx="130" cy="42" r="4"/><circle cx="270" cy="42" r="4"/><circle cx="380" cy="42" r="4"/></g>
  <!-- fenders -->
  <g class="p-ink" opacity=".55"><rect x="104" y="53" width="18" height="12" rx="5"/><rect x="186" y="53" width="18" height="12" rx="5"/><rect x="262" y="53" width="18" height="12" rx="5"/><rect x="320" y="53" width="18" height="12" rx="5"/></g>
  <!-- hull and deck -->
  <path class="p-hull" d="M40 66 L300 66 C345 66 365 92 374 113 C365 134 345 160 300 160 L40 160 C34 140 34 86 40 66 Z"/>
  <path class="p-deck" d="M48 74 L298 74 C338 74 354 96 362 113 C354 130 338 152 298 152 L48 152 C44 135 44 91 48 74 Z"/>
  <!-- accommodation and funnel (aft) -->
  <rect class="p-super" x="52" y="82" width="46" height="62" rx="2"/>
  <rect class="p-hull" x="60" y="101" width="14" height="24" rx="2"/>
  <!-- trunk deck with tank domes -->
  <rect class="p-soft" x="112" y="88" width="196" height="50" rx="4"/>
  <g class="p-dome" stroke-width="1.5"><circle cx="138" cy="113" r="9"/><circle cx="182" cy="113" r="9"/><circle cx="244" cy="113" r="9"/><circle cx="286" cy="113" r="9"/></g>
  <!-- manifold amidships -->
  <rect class="p-ink" x="207" y="76" width="9" height="74" opacity=".55"/>
  <!-- gangway, port side aft -->
  <polygon class="p-ink" points="76,67 84,67 106,34 98,34"/>
  <!-- forward / aft arrow -->
  <line class="p-arrow" x1="132" y1="205" x2="288" y2="205"/>
  <polyline class="p-arrow" points="142,197 132,205 142,213"/>
  <polyline class="p-arrow" points="278,197 288,205 278,213"/>
  <!-- water lines -->
  <g class="p-line" opacity=".25" stroke-width="1.2"><path d="M20 180 q15 -6 30 0 t30 0"/><path d="M300 190 q15 -6 30 0 t30 0"/><path d="M40 232 q15 -6 30 0 t30 0"/><path d="M330 236 q15 -6 30 0 t30 0"/></g>
</svg>
