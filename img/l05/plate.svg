<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img" aria-label="VHF radio set on the bridge console">
  <!-- Lesson 5 plate: VHF radio set with handset. Colours come from app.css (.p-*) -->
  <rect class="p-soft" x="0" y="0" width="400" height="230"/>
  <!-- console top -->
  <rect class="p-deck" x="0" y="168" width="400" height="62"/>
  <!-- call sign plate -->
  <rect class="p-white" x="34" y="18" width="128" height="30" rx="3"/>
  <text x="98" y="30" text-anchor="middle" style="font:500 7px var(--f-mono);letter-spacing:.1em;fill:var(--hull);opacity:.7">CALL SIGN</text>
  <text x="98" y="43" text-anchor="middle" style="font:600 13px var(--f-mono);fill:var(--hull);letter-spacing:.12em">C6XY7</text>
  <!-- radio body -->
  <rect class="p-hull" x="34" y="64" width="232" height="100" rx="8"/>
  <!-- display -->
  <rect class="p-water" x="50" y="78" width="96" height="44" rx="4"/>
  <text x="58" y="94" style="font:500 9px var(--f-mono);fill:var(--ink);opacity:.7">CH</text>
  <text x="118" y="114" text-anchor="middle" style="font:700 30px var(--f-mono);fill:var(--ink)">12</text>
  <!-- keypad -->
  <g class="p-soft" opacity=".85">
    <rect x="160" y="80" width="18" height="12" rx="2"/><rect x="184" y="80" width="18" height="12" rx="2"/><rect x="208" y="80" width="18" height="12" rx="2"/>
    <rect x="160" y="98" width="18" height="12" rx="2"/><rect x="184" y="98" width="18" height="12" rx="2"/><rect x="208" y="98" width="18" height="12" rx="2"/>
    <rect x="160" y="116" width="18" height="12" rx="2"/><rect x="184" y="116" width="18" height="12" rx="2"/><rect x="208" y="116" width="18" height="12" rx="2"/>
  </g>
  <rect class="p-red" x="160" y="138" width="66" height="14" rx="3"/>
  <!-- volume knob -->
  <circle class="p-soft" cx="246" cy="98" r="11"/><line class="p-stroke" x1="246" y1="98" x2="246" y2="88" stroke-width="2"/>
  <circle class="p-soft" cx="246" cy="134" r="8" opacity=".7"/>
  <!-- speaker grille -->
  <g class="p-soft" opacity=".35"><rect x="50" y="132" width="96" height="3"/><rect x="50" y="139" width="96" height="3"/><rect x="50" y="146" width="96" height="3"/></g>
  <!-- coiled cord -->
  <path class="p-stroke" stroke-width="2.4" d="M266 150 q8 6 0 10 q-8 4 0 10 q8 4 0 10 q-8 4 2 8 L300 186"/>
  <!-- handset lying on the console -->
  <rect class="p-hull" x="296" y="96" width="34" height="96" rx="12"/>
  <g class="p-soft" opacity=".4"><rect x="304" y="106" width="18" height="2"/><rect x="304" y="111" width="18" height="2"/><rect x="304" y="116" width="18" height="2"/></g>
  <!-- press-to-talk button on the side of the handset -->
  <rect class="p-orange" x="290" y="130" width="7" height="24" rx="2"/>
</svg>
