<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Left: the engine telegraph on the bridge, set at dead slow ahead, with the ahead side in green and the astern side in red. Right: the stern of the ship under water with the propeller and the rudder, and a tug with its towing hook and fenders">
  <!-- Lesson 28 plate. Left: the engine telegraph dial (half circle): STOP at the top, AHEAD on the right (green):
       dead slow, slow, half, full; ASTERN on the left (red), the same steps. The handle is at DEAD SLOW AHEAD.
       Right: side view of the stern, cut at the waterline: the propeller and, behind it, the rudder blade on its stock.
       A tug lies off the stern with the ship's line on its towing hook, black fenders all round and a big bow fender.
       Colours come from app.css (.p-*). -->
  <rect class="p-soft" x="0" y="0" width="400" height="240"/>
  <!-- ENGINE TELEGRAPH -->
  <rect x="8" y="58" width="156" height="98" rx="8" style="fill:#1D2730"/>
  <path d="M86 142 L16.0 142.0 A70 70 0 0 1 86.0 72.0 Z" style="fill:#E23D2D" opacity=".9"/>
  <path d="M86 142 L86.0 72.0 A70 70 0 0 1 156.0 142.0 Z" style="fill:#2E9E5B" opacity=".9"/>
  <path d="M32 142 A54 54 0 0 1 140 142 Z" style="fill:#F4F1EA"/>
  <text x="0" y="0" transform="translate(86.0 80.0) rotate(0)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">STOP</text>
  <line x1="86.0" y1="88.0" x2="86.0" y2="93.0" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(107.2 83.7) rotate(20)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">D.SLOW</text>
  <line x1="104.5" y1="91.3" x2="102.8" y2="96.0" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(127.5 95.9) rotate(42)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">SLOW</text>
  <line x1="122.1" y1="101.9" x2="118.8" y2="105.6" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(141.7 114.8) rotate(64)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">HALF</text>
  <line x1="134.5" y1="118.3" x2="130.0" y2="120.5" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(147.7 135.5) rotate(84)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">FULL</text>
  <line x1="139.7" y1="136.4" x2="134.7" y2="136.9" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(64.8 83.7) rotate(-20)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">D.SLOW</text>
  <line x1="67.5" y1="91.3" x2="69.2" y2="96.0" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(44.5 95.9) rotate(-42)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">SLOW</text>
  <line x1="49.9" y1="101.9" x2="53.2" y2="105.6" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(30.3 114.8) rotate(-64)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">HALF</text>
  <line x1="37.5" y1="118.3" x2="42.0" y2="120.5" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="0" y="0" transform="translate(24.3 135.5) rotate(-84)" text-anchor="middle" dominant-baseline="middle" style="font:700 6.2px var(--f-mono);fill:#fff">FULL</text>
  <line x1="32.3" y1="136.4" x2="37.3" y2="136.9" style="stroke:#13212D" stroke-width="1.2"/>
  <text x="110" y="132" text-anchor="middle" style="font:700 7.5px var(--f-mono);fill:#2E9E5B">AHEAD</text>
  <text x="62" y="132" text-anchor="middle" style="font:700 7.5px var(--f-mono);fill:#C8281C">ASTERN</text>
  <line x1="86" y1="142" x2="103.1" y2="95.0" style="stroke:#13212D" stroke-width="4" stroke-linecap="round"/>
  <circle cx="103.1" cy="95.0" r="4.5" style="fill:#13212D"/>
  <circle cx="86" cy="142" r="6" style="fill:#13212D"/>
  <rect x="8" y="150" width="156" height="12" rx="3" style="fill:#1D2730"/>
  <rect x="70" y="162" width="32" height="62" style="fill:#1D2730"/>
  <rect x="58" y="222" width="56" height="8" rx="2" style="fill:#1D2730"/>

  <!-- STERN under water: hull, PROPELLER, RUDDER -->
  <rect class="p-water" x="198" y="120" width="202" height="120"/>
  <path d="M198 40 H272 Q296 40 304 64 L308 120 H198 Z" class="p-hull"/>
  <path d="M198 120 H308 L302 150 Q296 166 270 170 L198 176 Z" class="p-red"/>
  <rect x="250" y="168" width="26" height="6" class="p-red"/>
  <path d="M244 172 H262" style="stroke:#5E6B78" stroke-width="5"/>
  <g style="fill:#C9A227;stroke:#7A6418" stroke-width=".8">
    <ellipse cx="266" cy="158" rx="5" ry="15" transform="rotate(-8 266 172)"/>
    <ellipse cx="266" cy="187" rx="5" ry="15" transform="rotate(8 266 172)"/>
  </g>
  <circle cx="266" cy="172" r="5" style="fill:#8A6E14"/>
  <rect x="291" y="120" width="4" height="22" style="fill:#5E6B78"/>
  <path d="M282 140 H306 Q310 140 310 146 L308 204 Q306 210 300 210 H284 Q280 210 280 204 Z" class="p-red" style="stroke:var(--hull)" stroke-width="1.2"/>
  <line x1="198" y1="120" x2="400" y2="120" class="p-stroke" stroke-width="1" opacity=".5"/>
  <circle cx="300" cy="72" r="3" class="p-white"/>

  <!-- TUG off the stern: line from the ship to the TOWING HOOK, black FENDERS -->
  <path d="M300 72 Q322 92 344 98" fill="none" style="stroke:#E9C46A" stroke-width="2"/>
  <path d="M336 104 H392 Q398 104 398 112 L392 126 H340 Z" style="fill:#E2671C;stroke:var(--hull)" stroke-width="1"/>
  <path d="M336 104 H392" style="stroke:#13212D" stroke-width="4" stroke-linecap="round"/>
  <path d="M340 126 H392" style="stroke:#13212D" stroke-width="3" stroke-linecap="round"/>
  <circle cx="335" cy="112" r="7" style="fill:#13212D"/>
  <rect x="362" y="82" width="22" height="20" rx="2" class="p-white" style="stroke:var(--hull)" stroke-width="1"/>
  <rect x="366" y="86" width="14" height="6" style="fill:#7FB7D6"/>
  <rect x="372" y="70" width="4" height="12" class="p-hull"/>
  <rect x="345" y="94" width="5" height="10" class="p-hull"/>
  <path d="M347 94 Q347 90 343 90 Q339 90 340 95" fill="none" style="stroke:var(--hull)" stroke-width="2.4" stroke-linecap="round"/>
</svg>