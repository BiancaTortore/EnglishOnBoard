<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 214" role="img" aria-label="One day on board on the 24-hour clock: meals, coffee breaks and a watch">
  <!-- Lesson 8 plate: one day on board, 0000 to 2400. Meal icons sit at their times; the bottom row is the
       Second Officer's watches (blue = on watch, grey = off duty). The red line is 1900, the time of the dialogue.
       Colours come from app.css (.p-*). Generated with a small script; x = 20 + hour × 15. -->
