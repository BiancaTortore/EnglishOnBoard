<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Mario's left hand with the cut between the thumb and the first finger, the pulse point on the wrist, and the first-aid kit: bandage, painkillers, thermometer and blood pressure monitor">
  <!-- Lesson 26 plate. Left: a left hand, palm towards us, with the cut between the thumb and the first finger
       (red line) and the pulse point on the inside of the wrist (dotted circle). Right: the open first-aid kit:
       a white bandage roll, a box of painkillers with a blister strip, a digital thermometer reading 36.8 and a blood
       pressure monitor with its cuff, reading 130/85 and pulse 92. Colours come from app.css (.p-*). -->
  <rect class="p-soft" x="0" y="0" width="400" height="240"/>
  <!-- forearm and hand (left hand, palm towards us) -->
  <g style="fill:#D9A47E;stroke:#8A5A3C" stroke-width="1.2">
    <path d="M70 240 L74 176 L134 176 L138 240 Z"/>
    <rect x="76" y="44" width="15" height="70" rx="7.5"/>
    <rect x="94" y="32" width="15" height="80" rx="7.5"/>
    <rect x="112" y="38" width="15" height="76" rx="7.5"/>
    <rect x="130" y="56" width="14" height="60" rx="7" transform="rotate(8 137 86)"/>
    <path d="M74 112 L48 80 Q42 72 35 77 Q29 83 34 90 L68 168 Z"/>
    <path d="M70 106 Q70 96 80 96 L136 96 Q146 96 146 108 L142 160 Q138 182 120 184 L88 184 Q70 182 66 160 Z"/>
  </g>
  <g style="stroke:#8A5A3C" stroke-width="1" opacity=".5" fill="none"><path d="M80 130 Q104 140 132 126"/><path d="M78 148 Q96 160 120 162"/></g>
  <!-- the cut between thumb and first finger -->
  <path d="M62 100 Q70 110 82 104" style="stroke:#C8281C" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- pulse point on the wrist -->
  <circle cx="96" cy="200" r="9" fill="none" style="stroke:#2F6FD6" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- first-aid kit -->
  <rect x="172" y="20" width="220" height="200" rx="8" class="p-white"/>
  <rect x="172" y="20" width="220" height="24" rx="8" style="fill:#2E9E5B"/>
  <path d="M276 26 H288 V30 H292 V36 H288 V40 H276 V36 H272 V30 H276 Z" style="fill:#fff" transform="translate(0 -1)"/>
  <!-- bandage roll -->
  <rect x="188" y="62" width="44" height="44" rx="22" style="fill:#F4F1EA;stroke:#8B8F94" stroke-width="1.2"/>
  <circle cx="210" cy="84" r="8" style="fill:#D8D4CA"/>
  <path d="M230 84 Q252 90 252 112 L244 112 Q244 96 228 94 Z" style="fill:#F4F1EA;stroke:#8B8F94" stroke-width="1"/>
  <!-- painkillers -->
  <rect x="190" y="130" width="50" height="30" rx="3" style="fill:#2F6FD6"/>
  <rect x="196" y="164" width="44" height="22" rx="3" style="fill:#C9D2DA;stroke:#8B8F94" stroke-width="1"/>
  <g style="fill:#fff;stroke:#8B8F94" stroke-width=".8"><circle cx="205" cy="175" r="4"/><circle cx="218" cy="175" r="4"/><circle cx="231" cy="175" r="4"/></g>
  <!-- thermometer -->
  <rect x="262" y="60" width="16" height="66" rx="8" style="fill:#F4F6F7;stroke:#5B6670" stroke-width="1.2"/>
  <rect x="265" y="72" width="10" height="26" rx="2" style="fill:#13212D"/>
  <text x="270" y="88" text-anchor="middle" transform="rotate(-90 270 85)" style="font:700 7px var(--f-mono);fill:#3DDC84">36.8</text>
  <rect x="267" y="122" width="6" height="12" rx="3" style="fill:#9AA6B2"/>
  <!-- blood pressure monitor and cuff -->
  <rect x="300" y="60" width="78" height="70" rx="6" style="fill:#F4F6F7;stroke:#5B6670" stroke-width="1.2"/>
  <rect x="308" y="68" width="62" height="40" rx="3" style="fill:#13212D"/>
  <text x="314" y="84" style="font:700 11px var(--f-mono);fill:#3DDC84">130/85</text>
  <text x="314" y="100" style="font:600 9px var(--f-mono);fill:#7FA7B8">♥ 92</text>
  <circle cx="339" cy="119" r="5" style="fill:#2E9E5B"/>
  <path d="M300 112 Q280 150 300 176" fill="none" style="stroke:#5B6670" stroke-width="2"/>
  <rect x="290" y="168" width="88" height="34" rx="8" style="fill:#2B3F57"/>
  <path d="M296 176 H372 M296 194 H372" style="stroke:#fff" stroke-width=".8" opacity=".4"/>
</svg>
