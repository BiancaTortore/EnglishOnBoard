<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Corridor fire station: four extinguishers with coloured labels (water, foam, dry powder, CO2), the fire classes sign, the fire hydrant with the hose box, and the fire blanket">
  <!-- Lesson 23 plate: a corridor bulkhead. Left: four red extinguishers on brackets, each with a coloured band
       (red = water, cream = foam, blue = dry powder, black = CO2 with a horn). Above them, the fire classes sign:
       A (solids), B (liquids), C (gases). Right: the fire hydrant with its valve wheel, the hose box with the hose
       rolled inside and, at the far right, the fire blanket in its red pouch. Colours come from app.css (.p-*). -->
  <rect class="p-soft" x="0" y="0" width="400" height="240"/>
  <path class="p-quay" d="M0 212 H400 V240 H0 Z"/>
  <line class="p-line" x1="0" y1="212" x2="400" y2="212" stroke-width="1" opacity=".5"/>
  <!-- fire classes sign -->
  <rect x="24" y="16" width="200" height="40" rx="4" class="p-white"/>
  <g style="font:700 18px var(--f-display);fill:var(--ink)" text-anchor="middle"><text x="60" y="43">A</text><text x="124" y="43">B</text><text x="188" y="43">C</text></g>
  <g class="p-ink" opacity=".55">
    <rect x="72" y="32" width="12" height="10" rx="1"/>
    <path d="M136 42 Q136 30 142 28 Q148 30 148 42 Z"/>
    <rect x="200" y="28" width="8" height="15" rx="4"/>
  </g>
  <!-- four extinguishers -->
  <g>
    <rect x="30" y="92" width="34" height="106" rx="12" class="p-red"/><rect x="30" y="122" width="34" height="18" style="fill:#E23D2D;stroke:#fff" stroke-width="1"/>
    <rect x="80" y="92" width="34" height="106" rx="12" class="p-red"/><rect x="80" y="122" width="34" height="18" style="fill:#F2E3B6"/>
    <rect x="130" y="92" width="34" height="106" rx="12" class="p-red"/><rect x="130" y="122" width="34" height="18" style="fill:#2F6FD6"/>
    <rect x="180" y="92" width="34" height="106" rx="12" class="p-red"/><rect x="180" y="122" width="34" height="18" style="fill:#151A1F"/>
  </g>
  <g class="p-ink">
    <rect x="42" y="80" width="10" height="14" rx="2"/><rect x="92" y="80" width="10" height="14" rx="2"/><rect x="142" y="80" width="10" height="14" rx="2"/><rect x="192" y="80" width="10" height="14" rx="2"/>
  </g>
  <!-- small pressure gauges -->
  <g><circle cx="47" cy="104" r="5" class="p-white"/><circle cx="97" cy="104" r="5" class="p-white"/><circle cx="147" cy="104" r="5" class="p-white"/></g>
  <!-- hoses; the CO2 one ends in a horn -->
  <path d="M52 84 Q66 84 66 104" fill="none" class="p-stroke" stroke-width="2"/>
  <path d="M102 84 Q116 84 116 104" fill="none" class="p-stroke" stroke-width="2"/>
  <path d="M152 84 Q166 84 166 104" fill="none" class="p-stroke" stroke-width="2"/>
  <path d="M202 84 Q222 84 222 112" fill="none" class="p-stroke" stroke-width="2.4"/><path d="M216 112 L228 112 L224 132 L220 132 Z" class="p-ink"/>
  <!-- brackets -->
  <g class="p-line" stroke-width="2"><line x1="28" y1="150" x2="66" y2="150"/><line x1="78" y1="150" x2="116" y2="150"/><line x1="128" y1="150" x2="166" y2="150"/><line x1="178" y1="150" x2="216" y2="150"/></g>

  <!-- fire hydrant -->
  <path d="M256 212 V150" class="p-stroke" stroke-width="10" style="stroke:var(--antifoul)"/>
  <rect x="246" y="148" width="20" height="16" rx="3" class="p-red"/>
  <circle cx="256" cy="136" r="12" fill="none" style="stroke:var(--antifoul)" stroke-width="3.5"/>
  <path d="M244 136 H268 M256 124 V148" style="stroke:var(--antifoul)" stroke-width="2"/>
  <!-- hose box with the rolled hose -->
  <rect x="280" y="80" width="62" height="96" rx="3" class="p-red"/>
  <rect x="286" y="86" width="50" height="84" rx="2" class="p-white"/>
  <circle cx="311" cy="122" r="20" fill="none" style="stroke:var(--gold)" stroke-width="7"/>
  <circle cx="311" cy="122" r="9" fill="none" style="stroke:var(--gold)" stroke-width="5"/>
  <rect x="300" y="148" width="22" height="8" rx="2" class="p-ink"/>
  <!-- fire blanket pouch -->
  <rect x="356" y="90" width="32" height="40" rx="3" class="p-red"/>
  <path d="M362 130 L366 142 H378 L382 130" class="p-red"/>
  <rect x="362" y="98" width="20" height="10" rx="1" style="fill:#fff" opacity=".8"/>
</svg>
