<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 400 186" role="img" aria-label="Side view of a Moss-type LNG carrier">
  <!-- Lesson 2 plate: the ship from the side, bow to the right. Colours come from app.css (.p-*) -->
  <rect class="p-soft" x="0" y="0" width="400" height="230"/>
  <rect class="p-water" x="0" y="160" width="400" height="70"/>
  <!-- funnel (aft of the accommodation) -->
  <rect class="p-hull" x="28" y="44" width="18" height="72" rx="2"/>
  <rect class="p-red" x="28" y="52" width="18" height="6"/>
  <!-- accommodation with the bridge on top -->
  <rect class="p-super" x="50" y="64" width="46" height="52"/>
  <g class="p-ink" opacity=".35"><rect x="56" y="74" width="34" height="2"/><rect x="56" y="86" width="34" height="2"/><rect x="56" y="98" width="34" height="2"/></g>
  <rect class="p-super" x="44" y="50" width="58" height="14"/>
  <rect class="p-ink" x="48" y="54" width="50" height="4" opacity=".7"/>
  <!-- mast on the bridge top -->
  <line class="p-stroke" x1="73" y1="50" x2="73" y2="34" stroke-width="2"/>
  <!-- four spherical cargo tanks -->
  <g class="p-dome" stroke-width="1.5"><circle cx="136" cy="106" r="26"/><circle cx="190" cy="106" r="26"/><circle cx="244" cy="106" r="26"/><circle cx="298" cy="106" r="26"/></g>
  <!-- hull: poop aft, main deck, raised forecastle at the bow -->
  <path class="p-hull" d="M22 116 L100 116 L100 120 L318 120 L318 106 L386 106 L368 176 L44 176 L22 150 Z"/>
  <path class="p-red" d="M30 160 L372 160 L368 176 L44 176 Z"/>
  <line class="p-stroke" x1="100" y1="120" x2="318" y2="120" stroke-width="1" opacity=".5"/>
  <!-- foremast on the forecastle -->
  <line class="p-stroke" x1="366" y1="106" x2="366" y2="66" stroke-width="2.4"/>
  <line class="p-stroke" x1="358" y1="76" x2="374" y2="76" stroke-width="2"/>
  <!-- sea -->
  <g class="p-stroke" opacity=".25" stroke-width="1.2"><path d="M10 196 q15 -6 30 0 t30 0"/><path d="M200 210 q15 -6 30 0 t30 0"/><path d="M320 192 q15 -6 30 0 t30 0"/></g>
</svg>
