<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Man overboard seen from above: the ship turning to starboard, the person in the water behind it with the lifebuoy and the orange smoke, the lookout pointing, and the rescue boat going out">
  <!-- Lesson 22 plate: seen from above. The ship (bow to the right; the whole drawing is mirrored by the outer group) has started to turn to starboard (its wake curves).
       Behind it, on the starboard quarter, the person in the water with the lifebuoy next to him and the orange smoke of
       the smoke float drifting downwind. On the starboard side aft, the lookout points with his arm. The rescue boat
       leaves the ship's side towards the person. The bridge has the MOB button (red). Colours come from app.css (.p-*). -->
  <rect class="p-water" x="0" y="0" width="400" height="240"/>
  <g transform="translate(400 0) scale(-1 1)">
  <!-- wake: curving, the ship turns -->
  <path d="M250 96 Q300 96 330 70 Q360 44 400 40" fill="none" stroke="#fff" stroke-width="10" opacity=".35" stroke-linecap="round"/>
  <!-- ship -->
  <g transform="rotate(-8 150 96)">
    <path d="M20 96 Q40 66 80 66 H252 Q262 66 262 76 V116 Q262 126 252 126 H80 Q40 126 20 96 Z" class="p-hull"/>
    <path d="M30 96 Q46 72 82 72 H248 V120 H82 Q46 120 30 96 Z" class="p-deck"/>
    <g class="p-dome"><circle cx="90" cy="96" r="15"/><circle cx="130" cy="96" r="15"/><circle cx="170" cy="96" r="15"/></g>
    <rect x="208" y="72" width="34" height="48" class="p-super" style="stroke:var(--ink)" stroke-width="1"/>
    <!-- MOB button on the bridge -->
    <circle cx="218" cy="80" r="5" class="p-red" style="stroke:#fff" stroke-width="1.4"/>
    <!-- lookout on the starboard side aft, arm pointing -->
    <circle cx="240" cy="128" r="4.5" class="p-orange"/>
    <path d="M243 130 L258 142" class="p-stroke" stroke-width="2.4" stroke-linecap="round"/>
    <!-- rescue boat leaving the starboard side -->
  </g>
  <path d="M198 146 Q222 166 248 176" fill="none" stroke="#fff" stroke-width="4" opacity=".5" stroke-linecap="round"/>
  <path d="M246 170 L270 178 Q276 182 270 186 L246 190 Q238 180 246 170 Z" class="p-orange" style="stroke:var(--ink)" stroke-width="1"/>
  <!-- person in the water -->
  <circle cx="320" cy="196" r="5" class="p-ink"/>
  <path d="M312 200 Q320 206 328 200" fill="none" stroke="#fff" stroke-width="1.6"/>
  <!-- lifebuoy -->
  <circle cx="340" cy="188" r="9" class="p-orange"/><circle cx="340" cy="188" r="4" class="p-water"/>
  <!-- smoke float and orange smoke drifting -->
  <rect x="352" y="196" width="7" height="10" rx="2" class="p-orange"/>
  <path d="M356 196 Q366 176 384 170 Q396 166 400 150" fill="none" style="stroke:var(--suit-orange)" stroke-width="12" opacity=".45" stroke-linecap="round"/>
  <!-- line of sight from the lookout -->
  <path d="M262 140 L314 192" class="p-line" stroke-width="1.2" stroke-dasharray="4 4"/>
  </g>
</svg>
