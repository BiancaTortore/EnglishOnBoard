<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Loading stores in Houston: the provision crane with its jib, wire rope and hook; the sling hangs on the hook by a wire eye with a thimble and lifts a pallet from the quay; on deck a pallet lashed to pad eyes, with a shackle">
  <!-- Lesson 11 plate, side view. Right: the quay with a pallet of stores in a four-leg sling on the crane hook.
       Centre: the provision crane on the ship's side; the wire rope runs from the
       jib head down to the hook block. Left, on deck: a pallet already landed and lashed to the deck with two lashings
       and turnbuckles to two small pad eyes welded to the deck; on the right a shackle joins the turnbuckle to the pad eye.
       On the hook: the top of the sling is a wire eye with a white thimble inside it.
       Colours come from app.css (.p-*). -->
  <rect class="p-soft" x="0" y="0" width="400" height="240"/>
  <!-- quay, water and ship -->
  <rect class="p-quay" x="228" y="200" width="172" height="40"/>
  <rect class="p-water" x="212" y="200" width="16" height="40"/>
  <rect class="p-hull" x="0" y="170" width="212" height="70"/>
  <rect class="p-deck" x="0" y="164" width="212" height="7"/>

  <!-- pallet already on deck, LASHED with two lashings and turnbuckles to two PAD EYES welded to the deck;
       on the left the turnbuckle hooks straight into the pad eye, on the right a SHACKLE joins them -->
  <rect class="p-hull" x="100" y="158" width="50" height="6"/>
  <g class="p-gold"><rect x="102" y="138" width="22" height="20" rx="1"/><rect x="126" y="138" width="22" height="20" rx="1"/></g>
  <g class="p-hull" opacity=".35"><rect x="102" y="146" width="46" height="1.5"/></g>
  <g style="stroke:#3B82C4" stroke-width="2.4" stroke-linecap="round"><path d="M103 139 L94 147"/><path d="M147 139 L157 146"/></g>
  <rect x="88" y="146" width="7" height="9" rx="1.5" class="p-hull" transform="rotate(35 91.5 150.5)"/>
  <path d="M88 154 Q85 156 86 158" fill="none" style="stroke:#5E6B78" stroke-width="1.6"/>
  <rect x="155" y="144" width="7" height="9" rx="1.5" class="p-hull" transform="rotate(-35 158.5 148.5)"/>
  <!-- left PAD EYE -->
  <path d="M80 164 V160 Q80 154 86 154 Q92 154 92 160 V164 Z" class="p-hull"/>
  <rect x="78" y="163" width="16" height="1.5" style="fill:#5E6B78"/>
  <circle cx="86" cy="159" r="2" class="p-soft"/>
  <!-- right pad eye with the SHACKLE -->
  <path d="M164 164 V160 Q164 154 170 154 Q176 154 176 160 V164 Z" class="p-hull"/>
  <rect x="162" y="163" width="16" height="1.5" style="fill:#5E6B78"/>
  <circle cx="170" cy="159" r="2" class="p-soft"/>
  <path d="M165.5 159 V152 Q165.5 147.5 170 147.5 Q174.5 147.5 174.5 152 V159" fill="none" style="stroke:#AEB8C2;stroke-linecap:round" stroke-width="2.2"/>
  <rect x="163.5" y="158" width="13" height="2.2" rx="1.1" style="fill:#AEB8C2;stroke:var(--hull)" stroke-width=".4"/>
  <path d="M161 151 L168 147.5" style="stroke:#5E6B78" stroke-width="1.6" stroke-linecap="round"/>

  <!-- the provision CRANE: pedestal, house, JIB, WIRE ROPE to the HOOK -->
  <rect class="p-super" x="184" y="122" width="18" height="42" style="stroke:var(--hull)" stroke-width="1"/>
  <rect class="p-super" x="174" y="102" width="38" height="22" rx="3" style="stroke:var(--hull)" stroke-width="1"/>
  <rect x="180" y="107" width="12" height="9" rx="1" style="fill:#7FB7D6"/>
  <path d="M198 108 L318 26 L322 32 L204 116 Z" class="p-gold" style="stroke:var(--hull)" stroke-width=".8"/>
  <g style="stroke:var(--hull)" stroke-width=".7" opacity=".6"><path d="M220 101 L226 92 M242 86 L248 77 M264 71 L270 62 M286 56 L292 47"/></g>
  <circle cx="320" cy="30" r="5" class="p-hull"/>
  <g style="stroke:#8A97A4" stroke-width="1.6"><path d="M317 31 V98 M323 31 V98"/></g>
  <!-- the top of the SLING: a wire eye with a white THIMBLE inside it, hanging on the HOOK -->
  <path d="M311 128 Q298 138 299 150 L311 164 L323 150 Q324 138 311 128 Z" fill="none" style="stroke:#8A97A4" stroke-width="3.2"/>
  <path d="M311 132 Q303 140 303.5 149 L311 159 L318.5 149 Q319 140 311 132 Z" style="fill:#FFFFFF;stroke:var(--hull)" stroke-width="1"/>
  <rect class="p-hull" x="310" y="96" width="20" height="16" rx="3"/>
  <path d="M320 112 v12 q0 12 -9 12 q-7 0 -7 -7" fill="none" style="stroke:var(--hull)" stroke-width="4" stroke-linecap="round"/>
  <rect x="306" y="164" width="10" height="5" rx="1" class="p-hull"/>
  <g style="stroke:#8A97A4" stroke-width="1.5"><path d="M311 169 L290 178 M311 169 L346 178"/></g>
  <g style="stroke:#8A97A4" stroke-width="1" opacity=".55"><path d="M311 169 L302 178 M311 169 L334 178"/></g>
  <g class="p-gold"><rect x="290" y="178" width="27" height="18" rx="1"/><rect x="319" y="178" width="27" height="18" rx="1"/></g>
  <rect class="p-hull" x="288" y="196" width="60" height="4"/>

</svg>
