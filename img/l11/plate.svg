<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="The stern from above, port side alongside: stern lines, breast line, springs, bollards, fairleads, winch and tug">
  <!-- Lesson 11 plate: the aft part of the ship seen from above. Bow to the left, port side alongside the quay (bottom).
       Pattern from BIBLE.md: 3 stern lines (going aft), 1 breast line (straight across), 2 springs (going forward).
       One stern line is slack (being let go); the winch heaves in. The tug is on the centre lead aft.
       Colours come from app.css (.p-*). -->
  <rect class="p-water" x="0" y="0" width="400" height="240"/>
  <!-- QUAY -->
  <rect class="p-quay" x="0" y="186" width="400" height="54"/>
  <line class="p-line" x1="0" y1="186" x2="400" y2="186" stroke-width="2"/>
  <!-- bollards on the quay edge -->
  <g class="p-hull">
    <circle cx="96" cy="200" r="6"/><circle cx="140" cy="200" r="6"/><circle cx="232" cy="200" r="6"/>
    <circle cx="330" cy="200" r="6"/><circle cx="362" cy="200" r="6"/><circle cx="392" cy="200" r="6"/>
  </g>
  <g class="p-soft"><circle cx="96" cy="200" r="2.5"/><circle cx="140" cy="200" r="2.5"/><circle cx="232" cy="200" r="2.5"/><circle cx="330" cy="200" r="2.5"/><circle cx="362" cy="200" r="2.5"/><circle cx="392" cy="200" r="2.5"/></g>

  <!-- SHIP: aft end, seen from above -->
  <path d="M0 40 H250 Q300 40 300 100 Q300 160 250 160 H0 Z" class="p-hull"/>
  <path d="M0 48 H248 Q290 48 290 100 Q290 152 248 152 H0 Z" class="p-deck"/>
  <!-- accommodation block -->
  <rect x="40" y="58" width="120" height="84" class="p-super" style="stroke:var(--hull)" stroke-width="1"/>
  <rect x="96" y="80" width="22" height="40" rx="3" class="p-hull" opacity=".55"/>
  <!-- winch drums on deck -->
  <!-- mooring WINCH: motor and gearbox on the left, the DRUM with the line wound on it, between two flanges -->
  <g transform="translate(200 124)">
    <rect x="-24" y="-9" width="12" height="18" rx="2" class="p-hull"/>
    <rect x="-12" y="-3" width="4" height="6" class="p-hull" opacity=".7"/>
    <rect x="-8" y="-12" width="3" height="24" rx="1" class="p-white"/>
    <rect x="11" y="-12" width="3" height="24" rx="1" class="p-white"/>
    <rect x="-5" y="-9" width="16" height="18" style="fill:#E9C46A"/>
    <g style="stroke:#B98A3A" stroke-width="1"><path d="M-3 -9 V9 M0 -9 V9 M3 -9 V9 M6 -9 V9 M9 -9 V9"/></g>
  </g>
  <!-- the winch works two stern lines:
       heave in = the lower line is tight and the arrow points in, to the winch;
       slack away = the upper line sags in waves and the arrow points out, away from the winch -->
  <g fill="none" style="stroke:#E9C46A" stroke-width="2.4" stroke-linecap="round">
    <path d="M214 130 L268 150"/>
    <path d="M214 118 Q220 104 230 104 q6 -6 11 0 t11 0 t11 0 t11 0 Q284 106 288 134"/>
  </g>
  <g style="stroke:var(--antifoul)" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M262 132 L236 122"/><path d="M234 88 L262 88"/></g>
  <path d="M229 119 L239 116 L236 126 Z" style="fill:var(--antifoul)"/>
  <path d="M269 88 L261 83 L261 93 Z" style="fill:var(--antifoul)"/>
  <!-- fairleads on the port side (ship's edge) -->
  <g class="p-white" style="stroke:var(--hull)" stroke-width="1">
    <rect x="186" y="150" width="12" height="7" rx="2"/><rect x="226" y="150" width="12" height="7" rx="2"/>
    <rect x="262" y="146" width="12" height="7" rx="2" transform="rotate(-25 268 150)"/><rect x="280" y="132" width="12" height="7" rx="2" transform="rotate(-50 286 136)"/>
  </g>
  <!-- centre lead aft -->
  <rect x="294" y="96" width="9" height="10" rx="2" class="p-white" style="stroke:var(--hull)" stroke-width="1"/>

  <!-- LINES (mooring lines: rope colour) -->
  <g fill="none" style="stroke:#E9C46A" stroke-width="2.4" stroke-linecap="round">
    <!-- springs: from aft, going forward -->
    <path d="M192 156 L96 196"/><path d="M195 156 L140 196"/>
    <!-- breast line: straight across -->
    <path d="M232 156 L232 194"/>
    <!-- stern lines: going aft -->
    <path d="M270 152 L330 196"/><path d="M288 138 L362 196"/>
    <!-- slack stern line: hangs in a curve -->
    <path d="M290 132 Q356 206 392 196" stroke-dasharray="1 0"/>
  </g>

  <!-- TUG on the centre lead -->
  <path d="M303 101 L346 101" style="stroke:#E9C46A" stroke-width="2" fill="none"/>
  <g transform="translate(368 101)">
    <path d="M-24 -14 H12 Q26 0 12 14 H-24 Q-28 0 -24 -14 Z" class="p-red"/>
    <rect x="-14" y="-7" width="18" height="14" rx="2" class="p-super"/>
    <rect x="-24" y="-3" width="8" height="6" class="p-hull"/>
  </g>
</svg>
