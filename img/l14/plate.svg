<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="The radar at night: heading line on course 110, a fishing boat on the port bow, and the panel with speed and position">
  <!-- Lesson 14 plate: the radar during the 03:45 handover, north up, 12-mile range, rings every 3 miles.
       The heading line shows course 110°. The fishing boat from the handover is on the port bow at 8 miles.
       The side panel shows course, speed in knots and position. Generated with a small script. -->
  <rect x="0" y="0" width="400" height="240" style="fill:#0B1620"/>
  <circle cx="128" cy="120" r="104" style="fill:#0E2A1F"/>
  <circle cx="128" cy="120" r="26.0" fill="none" style="stroke:#3DDC84" stroke-width="1" opacity=".35"/><circle cx="128" cy="120" r="52.0" fill="none" style="stroke:#3DDC84" stroke-width="1" opacity=".35"/><circle cx="128" cy="120" r="78.0" fill="none" style="stroke:#3DDC84" stroke-width="1" opacity=".35"/><line x1="128.0" y1="21.0" x2="128.0" y2="16.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="177.5" y1="34.3" x2="180.0" y2="29.9" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="213.7" y1="70.5" x2="218.1" y2="68.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="227.0" y1="120.0" x2="232.0" y2="120.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="213.7" y1="169.5" x2="218.1" y2="172.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="177.5" y1="205.7" x2="180.0" y2="210.1" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="128.0" y1="219.0" x2="128.0" y2="224.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="78.5" y1="205.7" x2="76.0" y2="210.1" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="42.3" y1="169.5" x2="37.9" y2="172.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="29.0" y1="120.0" x2="24.0" y2="120.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="42.3" y1="70.5" x2="37.9" y2="68.0" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><line x1="78.5" y1="34.3" x2="76.0" y2="29.9" style="stroke:#3DDC84" stroke-width="1" opacity=".6"/><text x="128.0" y="10.0" text-anchor="middle" style="font:600 7px var(--f-mono);fill:#3DDC84" opacity=".8">000</text><text x="241.0" y="123.0" text-anchor="middle" style="font:600 7px var(--f-mono);fill:#3DDC84" opacity=".8">090</text><text x="128.0" y="236.0" text-anchor="middle" style="font:600 7px var(--f-mono);fill:#3DDC84" opacity=".8">180</text><text x="15.0" y="123.0" text-anchor="middle" style="font:600 7px var(--f-mono);fill:#3DDC84" opacity=".8">270</text>
  <line x1="128" y1="120" x2="225.7" y2="155.6" style="stroke:#E9F5EC" stroke-width="1.6"/>
  <circle cx="128" cy="120" r="4" style="fill:#E9F5EC"/>
  <!-- the fishing boat: echo + vector -->
  <circle cx="196.3" cy="108.0" r="4" style="fill:#E9C46A"/>
  <line x1="196.3" y1="108.0" x2="182.3" y2="112.0" style="stroke:#E9C46A" stroke-width="1.4"/>
  <!-- side panel -->
  <rect x="252" y="20" width="136" height="200" rx="6" style="fill:#13212D"/>
  <g style="font:600 8px var(--f-mono);fill:#7FA7B8">
    <text x="264" y="42">COURSE</text><text x="264" y="92">SPEED</text><text x="264" y="142">POSITION</text><text x="264" y="190">RANGE 12 NM</text><text x="264" y="210">BRILL</text>
  </g>
  <g style="font:700 18px var(--f-mono);fill:#3DDC84">
    <text x="264" y="66">110.0°</text><text x="264" y="116">16.0</text>
  </g>
  <text x="320" y="116" style="font:700 12px var(--f-mono);fill:#3DDC84">kn</text>
  <g style="font:700 10px var(--f-mono);fill:#3DDC84"><text x="264" y="160">27°48.6' N</text><text x="264" y="174">089°41.2' W</text></g>
  <!-- range: rings; brilliance: how bright the screen is (bar at about two thirds) -->
  <rect x="296" y="203" width="56" height="8" rx="2" style="fill:#0B1620;stroke:#7FA7B8" stroke-width=".8"/>
  <rect x="297.5" y="204.5" width="36" height="5" rx="1" style="fill:#3DDC84"/>
  <g style="stroke:#3DDC84" stroke-width="1.2" stroke-linecap="round"><circle cx="363" cy="207" r="3" style="fill:#3DDC84"/><path d="M363 200.5 v2 M363 211.5 v2 M356.5 207 h2 M367.5 207 h2 M358.4 202.4 l1.4 1.4 M366.2 210.2 l1.4 1.4 M367.6 202.4 l-1.4 1.4 M359.8 210.2 l-1.4 1.4"/></g>
</svg>
